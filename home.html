<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!--se saca el logo del collapse para que sea visible en movil-->
    <a class="navbar-brand" href="#">
        <img src="Logo/Comodo2.png" alt="Logo" width="150" height="80">
    </a>
    <!--Tambien se saca el carrito y el modo administrador del collapse-->
    <!-- Botón Carrito -->
        <a href="#" class="btn btn-outline-dark position-relative" title="Carrito de compras">
          <i class="bi bi-cart3"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            0
          </span>
        </a>
      <form class="d-flex mx-auto" style="max-width: 500px; width: 100%;">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
      
      
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Todos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Categorias</a>
        </li>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Ofertas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Comentarios</a>
        </li>
      </ul>
      
       <!--Carrito + Modo Admin -->
      <div class="d-flex align-items-center ms-auto gap-2">

            <!-- Botón Modo Admin (toggle) -->
        <button class="btn btn-outline-primary d-flex align-items-center gap-1" type="button" id="btnAdmin" onclick="toggleAdmin()">
          <i class="bi bi-person-gear"></i>
          <span>Modo Admin</span>
        </button>
        
    </div>
  </div>
</nav>
<!-- Contenedor principal del catálogo -->
<main class="container my-4">
  
  <!-- Título de sección -->
  <h2 class="mb-3">Todos</h2>

  <!-- Grid de productos -->
  <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">

    <!-- Producto 1 -->
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Producto 1">
        <div class="card-body d-flex flex-column p-2 p-md-3">
          <h6 class="card-title mb-1">Nombre del producto</h6>
          <p class="card-text text-muted small mb-2">Categoría</p>
          <div class="mt-auto">
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="fw-bold text-success">$25.000</span>
              <small class="text-muted text-decoration-line-through">$35.000</small>
            </div>
            <button class="btn btn-sm btn-primary w-100" onclick="agregarAlCarrito(1)">
              <i class="bi bi-cart-plus"></i>
              <span class="d-none d-md-inline">Agregar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Producto 2 -->
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Producto 2">
        <div class="card-body d-flex flex-column p-2 p-md-3">
          <h6 class="card-title mb-1">Otro producto</h6>
          <p class="card-text text-muted small mb-2">Categoría</p>
          <div class="mt-auto">
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="fw-bold text-success">$18.000</span>
            </div>
            <button class="btn btn-sm btn-primary w-100" onclick="agregarAlCarrito(2)">
              <i class="bi bi-cart-plus"></i>
              <span class="d-none d-md-inline">Agregar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Producto 3 -->
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Producto 3">
        <div class="card-body d-flex flex-column p-2 p-md-3">
          <h6 class="card-title mb-1">Producto tres</h6>
          <p class="card-text text-muted small mb-2">Categoría</p>
          <div class="mt-auto">
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="fw-bold text-success">$42.000</span>
            </div>
            <button class="btn btn-sm btn-primary w-100" onclick="agregarAlCarrito(3)">
              <i class="bi bi-cart-plus"></i>
              <span class="d-none d-md-inline">Agregar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Producto 4 -->
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x300" class="card-img-top" alt="Producto 4">
        <div class="card-body d-flex flex-column p-2 p-md-3">
          <h6 class="card-title mb-1">Producto cuatro</h6>
          <p class="card-text text-muted small mb-2">Categoría</p>
          <div class="mt-auto">
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="fw-bold text-success">$30.000</span>
            </div>
            <button class="btn btn-sm btn-primary w-100" onclick="agregarAlCarrito(4)">
              <i class="bi bi-cart-plus"></i>
              <span class="d-none d-md-inline">Agregar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
</body>
</html>
